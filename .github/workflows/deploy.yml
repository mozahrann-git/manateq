# نشر تلقائي على GitHub Pages مع كل push على main
name: Deploy Manateq

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # يفعّل Pages تلقائياً لو لسه مش مفعّل في الريبو
          enablement: true
      # الموقع الساكن بس. خط الاستقبال بيشتغل على سيرفر تاني
      # ومينفعش ينشر هنا — ولا حتى ملف بيئة بالغلط.
      - name: جهّز الموقع من غير الخادم
        run: |
          mkdir -p _site
          cp -r assets *.html _site/
          test ! -e _site/server
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
