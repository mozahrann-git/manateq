# نشر تلقائي على GitHub Pages مع كل push على main
name: Deploy Manateq

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # يفعّل Pages تلقائياً لو لسه مش مفعّل في الريبو
          enablement: true
      # الموقع الساكن بس. خط الاستقبال بيشتغل على سيرفر تاني
      # ومينفعش ينشر هنا — ولا حتى ملف بيئة بالغلط.
      # الموقع العام بس. الإدارة بتتقدّم من الخادم ورا دخول،
      # وخط الاستقبال على سيرفر تاني — ولا واحد فيهم بيتنشر هنا.
      - name: جهّز الموقع العام
        run: |
          mkdir -p _site
          cp -r assets _site/
          for f in *.html; do
            case "$f" in admin*|portal.html) continue;; esac
            cp "$f" _site/
          done
          cp portal.html _site/          # بوابة السيلز عامة — اللينك الموقّع هو الحارس
          test ! -e _site/server
          if ls _site/admin* >/dev/null 2>&1; then echo "صفحة إدارة اتسرّبت للنشر"; exit 1; fi
          echo "اتنشر:"; ls _site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
