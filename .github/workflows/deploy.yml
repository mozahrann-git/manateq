# نشر تلقائي على GitHub Pages مع كل push على main
name: Deploy Manateq

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # شغلانتين منفصلين: واحدة بتجهّز وترفع، والتانية بتنشر بعد ما الرفع
  # يخلص خالص. لما كانوا في شغلانة واحدة، النشر كان ساعات بيدوّر على
  # الملف المرفوع قبل ما GitHub يكون شافه («Found 0 artifact(s)»).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: جهّز الموقع
        run: |
          mkdir -p _site
          cp -r assets _site/
          cp *.html _site/
          test ! -e _site/server
          # الإدارة بتتنشر وهي شغالة على بيانات تجريبية، والحارس بيقفل
          # لوحده أول ما السيرفر يتربط. البيانات الحقيقية عمرها ما بتعدّي
          # من غير توكن متفحوص على الخادم.
          grep -q 'MQ_API = ""' assets/js/api.js || {
            echo "السيرفر متربط — يبقى لازم Firebase متظبّط قبل النشر"
            grep -q 'apiKey: ""' assets/js/firebase-config.js && {
              echo "✗ متقفلش: السيرفر متربط والدخول لسه فاضي"; exit 1; }
          }
          echo "اتنشر:"; ls _site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
