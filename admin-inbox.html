<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستقبال · لوحة مناطق</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07090C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2307090C'/%3E%3Cpath d='M3 21V8l9-5 9 5v13M9 21v-7h6v7' stroke='%23FF7A1A' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/manateq.css">
</head>
<body class="admin">

<header data-adminhead></header>

<main class="wrap">
  <div class="opsline" id="opsline"></div>

  <div class="inbox">
    <!-- الطابور -->
    <aside class="qcol">
      <div class="qhead">
        <span class="lbl">الطابور الوارد</span>
        <span class="qn n" id="qn">0</span>
      </div>
      <div class="qlist" id="qlist"></div>
      <div class="qfoot">
        <button class="btn" type="button" id="addBtn">+ الصق رسالة يدوي</button>
      </div>
    </aside>

    <!-- الرسالة الخام -->
    <section class="rcol">
      <div class="rhead">
        <div>
          <p class="lbl" id="mId">—</p>
          <h2 id="mRep">—</h2>
          <p class="rsub" id="mSub"></p>
        </div>
        <span class="qscore" id="mScore">—</span>
      </div>
      <textarea class="rawbox" id="rawbox" spellcheck="false" aria-label="نص الرسالة"></textarea>
      <p class="hint">عدّل النص وشوف القراءة بتتغيّر لحظياً — ده بيساعدك تفهم النظام بيقرا إزاي.</p>
    </section>

    <!-- القراءة -->
    <section class="fcol">
      <div class="fhead2">
        <span class="lbl">اللي قرأه النظام</span>
        <span class="chip" id="profChip">—</span>
      </div>
      <div class="flist" id="flist"></div>

      <div class="dbox" id="verdictBox"></div>
      <div class="sigs" id="sigs"></div>

      <div class="acts">
        <button class="b1" type="button" id="okBtn">اعتمد وسجّل</button>
        <button class="btn" type="button" id="noBtn">ارفض</button>
        <button class="btn" type="button" id="skipBtn">أجّل</button>
      </div>
      <p class="hint" id="actHint"></p>
    </section>
  </div>

  <section>
    <div class="rowhead">
      <h2>سجل القرارات</h2>
      <p class="note">مفيش رسالة بتضيع. كل واحدة اتعمل فيها إيه ومين قرر ومتى.</p>
    </div>
    <div class="tw"><table><thead><tr>
      <th>الوقت</th><th>مين</th><th>القرار</th><th>الرسالة</th><th>الملاحظة</th>
    </tr></thead><tbody id="logTb"></tbody></table></div>
  </section>
</main>

<!-- نافذة التصحيح -->
<div class="gate" id="fixGate" hidden>
  <div class="gbox" role="dialog" aria-modal="true" aria-label="تصحيح حقل">
    <button class="gx" type="button" id="fixX" aria-label="إغلاق">✕</button>
    <p class="lbl">تصحيح قراءة</p>
    <h2 id="fixTitle">—</h2>
    <p class="gnote" id="fixLine"></p>
    <label class="glab" for="fixVal">القيمة الصحيحة</label>
    <input id="fixVal" class="ginp" type="text" inputmode="numeric">
    <label class="chk"><input type="checkbox" id="fixLearn" checked>
      <span>سجّل ده كقاعدة في نموذج <b id="fixWho">—</b> — الرسايل الجاية منه هتتقري صح لوحدها</span></label>
    <button class="b1 gbtn" type="button" id="fixOk">صحّح واتعلّم</button>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/parser.js"></script>
<script src="assets/js/admin-data.js"></script>
<script src="assets/js/page-inbox.js"></script>
</body>
</html>
